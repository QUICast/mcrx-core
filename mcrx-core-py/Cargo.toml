[package]
name = "mcrx-core-py"
version = "0.2.2"
edition = "2024"
license = "BSD-2-Clause"
description = "Python bindings for the mcrx-core multicast receiver library."
repository = "https://github.com/QUICast/mcrx-core"
homepage = "https://github.com/QUICast/mcrx-core"
readme = "README.md"

[lib]
crate-type = ["cdylib"]

[dependencies]
mcrx-core = { version = "0.2.1", path = ".." }
pyo3 = { version = "0.28.3", features = ["extension-module", "abi3-py39"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_NetworkManagement_IpHelper"] }

[build-dependencies]
pyo3-build-config = "0.28.3"
