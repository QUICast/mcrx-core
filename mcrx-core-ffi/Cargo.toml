[package]
name = "mcrx-core-ffi"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "BSD-2-Clause"
description = "C ABI bindings for the mcrx-core multicast receiver library."
repository = "https://github.com/QUICast/mcrx-core"
homepage = "https://github.com/QUICast/mcrx-core"
readme = "README.md"

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
mcrx-core = { version = "0.2.7", path = ".." }
libc = "0.2"

[dev-dependencies]
socket2 = "0.6.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_NetworkManagement_IpHelper"] }
