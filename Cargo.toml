[package]
name = "mcrx-core"
version = "0.1.2"
edition = "2024"
license = "BSD-2-Clause"
description = "Runtime-agnostic and portable IPv4 multicast receiver library for ASM and SSM."
readme = "README.md"
repository = "https://github.com/QUICast/mcrx-core"
homepage = "https://github.com/QUICast/mcrx-core"
documentation = "https://docs.rs/mcrx-core"
keywords = ["multicast", "udp", "asm", "ssm", "networking"]
categories = ["network-programming"]


[features]
default = []
metrics = []
tokio = ["dep:tokio"]

[dependencies]
socket2 = { version = "0.6.3", features = ["all"] }
bytes = "1"
thiserror = "2.0.18"
libc = "0.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_System_IO"] }

[[bin]]
name = "mcrx_tokio_recv"
path = "src/bin/mcrx_tokio_recv.rs"
required-features = ["tokio"]
